# Mongo + mock HTTP + Naryo. Ethereum = Base Sepolia via EVM_RPC_URL (no local Anvil). Default public RPC may be flaky;
# set EVM_RPC_URL in .env to Alchemy/Infura if Naryo fails at startup ("Could not subscribe to block stream").
# See docs/NARYO_VERIFY.md for the CRUD + operation-polling walkthrough.
services:
  mongodb:
    image: mongo:7
    container_name: naryo-verify-mongodb
    ports:
      - "27017:27017"
    volumes:
      - naryo-verify-mongo:/data/db
    networks:
      - naryo-verify

  mock-http:
    image: mockoon/cli:latest
    container_name: naryo-verify-mock-http
    restart: on-failure
    ports:
      - "7070:7070"
    networks:
      - naryo-verify
    command: ["--data", "data", "--port", "7070", "--log-transaction"]
    volumes:
      - ./mock_http_server.yaml:/data

  naryo-server:
    # Override: NARYO_IMAGE=ghcr.io/lf-decentralized-trust-labs/naryo:sha-001c9a2 docker compose up -d
    image: ${NARYO_IMAGE:-ghcr.io/lf-decentralized-trust-labs/naryo:latest}
    container_name: naryo-verify-naryo
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NARYO_DECLARATIVE_HTTP_INGEST_URL: ${NARYO_DECLARATIVE_HTTP_INGEST_URL:-http://host.docker.internal:8080}
      EVM_RPC_URL: ${EVM_RPC_URL:-https://sepolia.base.org}
      # hedera-local-node mirror REST as seen from the Naryo container (host gateway; default port 5551).
      HEDERA_MIRROR_URL: ${HEDERA_MIRROR_URL:-https://testnet.mirrornode.hedera.com}
      # HCS topic id (0.0.x) for the declarative TRANSACTION filter in application.yml.
      # SOLO_HCS_TOPIC_ID is a deprecated alias if LOCAL_NODE_HCS_TOPIC_ID is unset.
      LOCAL_NODE_HCS_TOPIC_ID: ${LOCAL_NODE_HCS_TOPIC_ID:-${SOLO_HCS_TOPIC_ID:-0.0.0}}
    depends_on:
      mongodb:
        condition: service_started
      mock-http:
        condition: service_started
    ports:
      # Naryo listens on 8060 inside the image; map to 6060 on the host for docs/scripts.
      - "6060:8060"
    networks:
      - naryo-verify
    volumes:
      - ./application.yml:/app/application.yml

networks:
  naryo-verify:
    driver: bridge

volumes:
  naryo-verify-mongo:
