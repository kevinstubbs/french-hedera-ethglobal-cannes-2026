# Baseline follows Naryo upstream examples:
# - Ethereum: examples/quickstart (Anvil on the compose network)
# - Hedera: examples/hedera-quickstart (local mirror REST; hedera-local-node on host, typically :5551)
# Config guide: https://github.com/LF-Decentralized-Trust-labs/Naryo/blob/main/docs/configuration/configuration-core.md
naryo:
  nodes:
    - id: eadc75b2-4217-4018-95af-f67c13058976
      name: anvil
      type: ETHEREUM
      connection:
        type: HTTP
        endpoint:
          url: http://anvil:8545
      interaction:
        strategy: BLOCK_BASED
        mode: ETHEREUM_RPC
      subscription:
        strategy: BLOCK_BASED
        method: POLL
        interval: 1s
        confirmationBlocks: 1

    - id: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      name: hedera-local-node
      type: HEDERA
      connection:
        type: HTTP
        endpoint:
          # hedera-local-node mirror REST (set HEDERA_MIRROR_URL; compose defaults it — do not use
          # ${VAR:http://...} here: Spring treats the first ':' as the default delimiter).
          url: ${HEDERA_MIRROR_URL}
      interaction:
        strategy: BLOCK_BASED
        mode: HEDERA_MIRROR_NODE
        limitPerRequest: 100
        retriesPerRequest: 3
      subscription:
        strategy: BLOCK_BASED
        method: POLL
        interval: 1s
        confirmationBlocks: 0

  broadcasting:
    configuration: []
    broadcasters: []

  # Declarative Hedera filter (same shape as hedera-quickstart). Set LOCAL_NODE_HCS_TOPIC_ID to a
  # real topic from hedera-local-node; SOLO_HCS_TOPIC_ID is a deprecated env alias (see compose).
  filters:
    - id: a5605668-7a88-4e5c-b4ee-4a8417b7184d
      name: local-node-hcs-topic
      nodeId: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      type: TRANSACTION
      identifierType: IDENTITY_ID
      value: ${LOCAL_NODE_HCS_TOPIC_ID:${SOLO_HCS_TOPIC_ID:0.0.0}}

  stores:
    - nodeId: eadc75b2-4217-4018-95af-f67c13058976
      type: mongo
      features:
        - type: EVENT
          strategy: BLOCK_BASED
          targets:
            - type: BLOCK
              destination: blocks
            - type: TRANSACTION
              destination: transactions
            - type: CONTRACT_EVENT
              destination: contract-events
        - type: FILTER_SYNC
          destination: filters
    - nodeId: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      type: mongo
      features:
        - type: EVENT
          strategy: BLOCK_BASED
          targets:
            - type: BLOCK
              destination: blocks-hedera
            - type: TRANSACTION
              destination: transactions-hedera
            - type: CONTRACT_EVENT
              destination: contract-events-hedera
        - type: FILTER_SYNC
          destination: filters-hedera

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/naryo
      auto-index-creation: true

server:
  port: 8060
