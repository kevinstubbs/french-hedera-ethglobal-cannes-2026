# Baseline follows Naryo upstream examples:
# - Ethereum: examples/quickstart (Anvil on the compose network)
# - Hedera: examples/hedera-quickstart (mirror REST only). Set HEDERA_MIRROR_URL in compose/.env, e.g.
#     Local:  http://host.docker.internal:5551 (hedera-local-node mirror on host)
#     Testnet: https://testnet.mirrornode.hedera.com
#   Set LOCAL_NODE_HCS_TOPIC_ID to your HCS topic (e.g. 0.0.8510924 on testnet). SOLO_HCS_TOPIC_ID is a deprecated alias.
# Config guide: https://github.com/LF-Decentralized-Trust-labs/Naryo/blob/main/docs/configuration/configuration-core.md
naryo:
  nodes:
    - id: eadc75b2-4217-4018-95af-f67c13058976
      name: anvil
      type: ETHEREUM
      connection:
        type: HTTP
        endpoint:
          url: http://anvil:8545
      interaction:
        strategy: BLOCK_BASED
        mode: ETHEREUM_RPC
      subscription:
        strategy: BLOCK_BASED
        method: POLL
        interval: 1s
        confirmationBlocks: 1

    - id: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      name: hedera-mirror
      type: HEDERA
      connection:
        type: HTTP
        endpoint:
          # Injected by docker-compose (.env); default in compose is local hedera-local-node :5551.
          # Do not use ${VAR:http://...} defaults in YAML — Spring treats ':' as the delimiter.
          url: ${HEDERA_MIRROR_URL}
      interaction:
        strategy: BLOCK_BASED
        mode: HEDERA_MIRROR_NODE
        limitPerRequest: 100
        retriesPerRequest: 3
      subscription:
        strategy: BLOCK_BASED
        method: POLL
        interval: 1s
        confirmationBlocks: 0

  broadcasting:
    configuration: []
    broadcasters: []

  # Declarative Hedera filter (hedera-quickstart shape). Topic id at runtime via env (see deploy/naryo-verify/.env.example).
  filters:
    - id: a5605668-7a88-4e5c-b4ee-4a8417b7184d
      name: local-node-hcs-topic
      nodeId: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      type: TRANSACTION
      identifierType: IDENTITY_ID
      value: ${LOCAL_NODE_HCS_TOPIC_ID:${SOLO_HCS_TOPIC_ID:0.0.0}}

  stores:
    - nodeId: eadc75b2-4217-4018-95af-f67c13058976
      type: mongo
      features:
        - type: EVENT
          strategy: BLOCK_BASED
          targets:
            - type: BLOCK
              destination: blocks
            - type: TRANSACTION
              destination: transactions
            - type: CONTRACT_EVENT
              destination: contract-events
        - type: FILTER_SYNC
          destination: filters
    - nodeId: 7f3b8e1a-4d2c-4b9a-8e5f-1a2b3c4d5e6f
      type: mongo
      features:
        - type: EVENT
          strategy: BLOCK_BASED
          targets:
            - type: BLOCK
              destination: blocks-hedera
            - type: TRANSACTION
              destination: transactions-hedera
            - type: CONTRACT_EVENT
              destination: contract-events-hedera
        - type: FILTER_SYNC
          destination: filters-hedera

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/naryo
      auto-index-creation: true

server:
  port: 8060
