name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: agents/trading-signal/package-lock.json
      - name: Go test (./cmd/... ./internal/... — full suite)
        run: go test ./cmd/... ./internal/... -count=1
      - name: trading-signal (Vitest)
        working-directory: agents/trading-signal
        run: npm ci && npm test -- --run
